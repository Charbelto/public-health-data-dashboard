name: Quick Test

# Run on every push for quick feedback
on:
  push:
  pull_request:

jobs:
  quick-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short -x

    - name: Test imports
      run: |
        python -c "from src import main, cleaning, analysis, crud, activity_logger"
        echo "✅ All modules import successfully"

